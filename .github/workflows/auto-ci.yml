name: Auto CI (APK release)

# RCCE releases use the stamp encoded in pubspec.yaml: 26.2.102620 becomes
# 26h2-102620. Local Android builds and CI therefore share the same identity:
#
#   same stamp, >100 lines added  -> rebuild, overwrite the asset in place
#   same stamp, <=100 lines       -> skip (a no-op push is not worth an APK)
#   new stamp                     -> tag <stamp> and open a release for it
#
# The fork has no production keystore secrets, so builds are signed with the
# committed key at ci/techpie-test-keystore.p12 — it is the Android debug key
# the Xiaomi wearable app-link database has on file for this package
# (SHA-1 FD:D3:9F:17:…), so the band bridge's fingerPrintVerify passes. Its
# password is printed in this file; it protects nothing. Committing it keeps
# the signature constant, so builds update over each other — install one only
# after uninstalling the store-signed app. Adding ANDROID_KEYSTORE_BASE64 +
# ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD to the
# fork's settings switches every build to that keystore instead.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build APK and publish to the version's release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to do
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          declared="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          if [[ ! "$declared" =~ ^([0-9]{2})\.([12])\.([0-9]{6})\+([0-9]+)$ ]]; then
            echo "::error::Expected a stamp version such as 26.2.102620+26102620, got $declared"
            exit 1
          fi
          stamp="${BASH_REMATCH[1]}h${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
          version_code="${BASH_REMATCH[4]}"
          expected_code="${BASH_REMATCH[1]}${BASH_REMATCH[3]}"
          if [[ "$version_code" != "$expected_code" ]]; then
            echo "::error::versionCode must be $expected_code for $stamp"
            exit 1
          fi
          tag="$stamp"

          # -1 means "rebuild": it is the default until a measured line count
          # says otherwise, and it covers every path that never measures —
          # force-pushes, first runs, and new releases alike.
          added=-1

          # A new release is opened when this exact stamp has no release yet.
          if gh release view "$tag" >/dev/null 2>&1; then
            mode=replace
            # Count the lines added since the push's base commit. After a
            # force-push that SHA is unreachable, in which case there is no
            # baseline to compare against — rebuild rather than guess.
            if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              added="$(git diff --numstat "$BEFORE"..HEAD | awk '{added+=$1} END {print added+0}')"
            fi
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$added" -ge 0 && "$added" -le 100 ]]; then
              mode=skip
            fi
          else
            mode=new-release
          fi

          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "version_code=$version_code"
            echo "added_lines=$added"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode tag=$tag version_code=$version_code added_lines=${added:-n/a}"

      - name: Set up Java
        if: steps.decide.outputs.mode != 'skip'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.decide.outputs.mode != 'skip'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      # The committed lock resolves through the China mirror (see .envrc).
      - name: Resolve locked dependencies
        if: steps.decide.outputs.mode != 'skip'
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get --enforce-lockfile

      # Release signing. Gradle hard-fails a release build unless all four
      # ANDROID_* values are present, so every run signs with either the
      # fork's production keystore (when its secrets are set) or the committed
      # test key at ci/techpie-test-keystore.p12 — a fixed key, so rebuilt
      # APKs always update over each other. The secrets context cannot appear
      # in step `if:` expressions, so the absence check happens inside.
      - name: Restore release keystore (optional)
        id: release-key
        if: steps.decide.outputs.mode != 'skip'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; signing with the committed test key."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/techpie-release.p12"
          test -s "$RUNNER_TEMP/techpie-release.p12"
          echo "path=$RUNNER_TEMP/techpie-release.p12" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.decide.outputs.mode != 'skip'
        env:
          # Each value prefers the production secret and falls back to the
          # committed test key. PKCS12 keys use the store password for the key
          # entry too, so both passwords are the same.
          ANDROID_KEYSTORE_PATH: ${{ steps.release-key.outputs.path || format('{0}/ci/techpie-test-keystore.p12', github.workspace) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'techpie-ci-store' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'techpie-test' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'techpie-ci-store' }}
          # The APK's versionName is the build stamp (`26h2-102610`) and its
          # versionCode is the same clock as yyMMDDHH, so the About tile shows
          # the stamp and installs order by build time.
          VERSION_NAME: ${{ steps.decide.outputs.tag }}
          VERSION_CODE: ${{ steps.decide.outputs.version_code }}
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --build-name "$VERSION_NAME" \
            --build-number "$VERSION_CODE"

      - name: Publish to the release
        if: steps.decide.outputs.mode != 'skip'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.decide.outputs.mode }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail

          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          # One fixed asset name per stamp, so a rebuild overwrites the same
          # file instead of stacking dated copies on the release page.
          asset="TechPie-$TAG-android.apk"
          cp "$apk" "$asset"

          # The checksum is what separates a mangled download from a good one:
          # a corrupt transfer keeps the right byte count, and the installer's
          # "packageInfo is NULL" then blames the wrong thing. The block sits
          # under a heading the in-app dialog already strips from the changelog.
          sha="$(sha256sum "$asset" | cut -d' ' -f1)"
          # The markdown fence below is literal text, not an unexpanded
          # expression shellcheck can see through; the directive says so.
          # shellcheck disable=SC2016
          notes="$(printf 'Auto-built APK from %s (%s).\n\nSigned with the development key of this fork (or its production keystore once configured); uninstall any store-signed install first.\n\n## SHA-256\n\n```text\n%s  %s\n```' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$sha" "$asset")"

          if [[ "$MODE" == "new-release" ]]; then
            gh release create "$TAG" "$asset" \
              --target "$GITHUB_SHA" \
              --title "TechPie $TAG" \
              --notes "$notes" \
              --latest
            echo "Opened release $TAG with the APK."
          else
            gh release upload "$TAG" "$asset" --clobber
            # The overwrite changed the bytes; the notes must change with them.
            gh release edit "$TAG" --notes "$notes"
            echo "Replaced the APK on release $TAG."
          fi
