name: Auto CI (test APK)

# Test-build pipeline for this fork only — not part of the upstream release
# process. Every push to a tracked branch either replaces the APK on the
# current version's release or opens a new one when pubspec.yaml moved:
#
#   same version, >100 lines added  -> rebuild, overwrite the asset in place
#   same version, <=100 lines       -> skip (a no-op push is not worth an APK)
#   new version                     -> tag v<version> and open a release for it
#
# The fork has no production keystore secrets, so builds are signed with a
# persistent test key (generated once, then cached): install one of these only
# after uninstalling the store-signed app, and updates work across rebuilds
# because the signature is stable. Adding ANDROID_KEYSTORE_BASE64 +
# ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD to the
# fork's settings switches every build to that keystore instead.

on:
  push:
    branches: [master, "bionic/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build APK and publish to the version's release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to do
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9]+)?$ ]]; then
            echo "::error::Unrecognized pubspec version: $version"
            exit 1
          fi
          tag="v$version"

          # -1 means "rebuild": it is the default until a measured line count
          # says otherwise, and it covers every path that never measures —
          # force-pushes, first runs, and new releases alike.
          added=-1

          # A new release is opened when this exact tag has no release yet.
          if gh release view "$tag" >/dev/null 2>&1; then
            mode=replace
            # Count the lines added since the push's base commit. After a
            # force-push that SHA is unreachable, in which case there is no
            # baseline to compare against — rebuild rather than guess.
            if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              added="$(git diff --numstat "$BEFORE"..HEAD | awk '{added+=$1} END {print added+0}')"
            fi
            if [[ "$added" -ge 0 && "$added" -le 100 ]]; then
              mode=skip
            fi
          else
            mode=new-release
          fi

          prerelease=false
          [[ "${version%%+*}" == *-* ]] && prerelease=true

          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "added_lines=$added"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode tag=$tag added_lines=${added:-n/a}"

      - name: Set up Java
        if: steps.decide.outputs.mode != 'skip'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.decide.outputs.mode != 'skip'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      # The committed lock resolves through the China mirror (see .envrc).
      - name: Resolve locked dependencies
        if: steps.decide.outputs.mode != 'skip'
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get --enforce-lockfile

      # Release signing. Gradle hard-fails a release build unless all four
      # ANDROID_* values are present, so every run must end up with one of two
      # keystores: the fork's production key (when its secrets are set) or a
      # persistent test key generated here and kept in the Actions cache —
      # stable across runs, so rebuilt APKs update over each other. The
      # secrets context cannot appear in step `if:` expressions, so the absence
      # check happens inside the first step.
      - name: Restore release keystore (optional)
        id: release-key
        if: steps.decide.outputs.mode != 'skip'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; falling back to the test key."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/techpie-release.p12"
          test -s "$RUNNER_TEMP/techpie-release.p12"
          echo "path=$RUNNER_TEMP/techpie-release.p12" >> "$GITHUB_OUTPUT"

      # The cache is the keystore's home: a hit means last run already
      # generated it, and saving after every build keeps it alive.
      - name: Cache test keystore
        id: test-key-cache
        if: steps.decide.outputs.mode != 'skip' && !steps.release-key.outputs.path
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/techpie-test-keystore.p12
          key: techpie-test-keystore-v1

      - name: Prepare test keystore
        id: test-key
        if: steps.decide.outputs.mode != 'skip' && !steps.release-key.outputs.path
        shell: bash
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/techpie-test-keystore.p12"
          if [[ ! -f "$keyfile" ]]; then
            echo "Cache miss; generating a fresh test keystore."
            umask 077
            keytool -genkeypair \
              -keystore "$keyfile" \
              -storetype PKCS12 \
              -alias techpie-test \
              -keyalg RSA -keysize 2048 \
              -validity 10950 \
              -dname "CN=TechPie Test, OU=CI, O=GeekPie, C=CN" \
              -storepass techpie-ci-store \
              -keypass techpie-ci-key
          fi
          {
            echo "path=$keyfile"
            echo "store-password=techpie-ci-store"
            echo "key-alias=techpie-test"
            echo "key-password=techpie-ci-key"
          } >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.decide.outputs.mode != 'skip'
        env:
          # Each value prefers the production secret and falls back to the
          # test key's fixed values when the fork has no keystore secrets.
          ANDROID_KEYSTORE_PATH: ${{ steps.release-key.outputs.path || steps.test-key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || steps.test-key.outputs.store-password }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || steps.test-key.outputs.key-alias }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || steps.test-key.outputs.key-password }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --build-name "${VERSION%%+*}" \
            --build-number "${VERSION##*+}"

      - name: Publish to the release
        if: steps.decide.outputs.mode != 'skip'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.decide.outputs.mode }}
          TAG: ${{ steps.decide.outputs.tag }}
          PRERELEASE: ${{ steps.decide.outputs.prerelease }}
        run: |
          set -euo pipefail

          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          # One fixed asset name per version, so a rebuild overwrites the same
          # file instead of stacking dated copies on the release page.
          cp "$apk" "TechPie-${TAG#v}-android.apk"

          if [[ "$MODE" == "new-release" ]]; then
            # gh release create resolves a missing tag against the default
            # branch's HEAD — wrong for this fork, where the code lives on
            # bionic/**. Point the tag at exactly what was just built.
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
            gh release create "$TAG" "TechPie-${TAG#v}-android.apk" \
              --title "Test build ${TAG#v}" \
              --notes "$(printf 'Auto-built test APK from %s (%s).\n\nSigned with this fork%s; uninstall any store-signed install first.' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "'s persistent test key (or its production keystore once configured)")" \
              --prerelease="$PRERELEASE" \
              --latest=false
            echo "Opened release $TAG with the APK."
          else
            gh release upload "$TAG" "TechPie-${TAG#v}-android.apk" --clobber
            echo "Replaced the APK on release $TAG."
          fi
