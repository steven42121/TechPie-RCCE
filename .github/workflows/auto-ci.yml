name: Auto CI (release builds)

# RCCE releases use the stamp encoded in pubspec.yaml: 26.2.102620 becomes
# 26h2-102620. Local Android builds and CI therefore share the same identity:
#
#   same stamp, >100 lines added  -> rebuild, overwrite the asset in place
#   same stamp, <=100 lines       -> skip (a no-op push is not worth an APK)
#   new stamp                     -> tag <stamp>, open a release for it, and
#                                    build the Linux and Windows bundles too
#
# The desktop bundles follow the tag rather than the push. A bundle's name
# carries the stamp, so a same-stamp rebuild would republish bytes under a name
# claiming they are the release that stamp is; the phone is what a mid-stamp
# push gets tested on, so paying a Windows runner for that churn buys nothing.
# `desktop_builds` on a dispatch is the exception a human makes on purpose: the
# replay path for a stamp whose bundle has to be rebuilt.
#
# The fork has no production keystore secrets, so builds are signed with the
# committed key at ci/techpie-test-keystore.p12 — it is the Android debug key
# the Xiaomi wearable app-link database has on file for this package
# (SHA-1 FD:D3:9F:17:…), so the band bridge's fingerPrintVerify passes. Its
# password is printed in this file; it protects nothing. Committing it keeps
# the signature constant, so builds update over each other — install one only
# after uninstalling the store-signed app. Adding ANDROID_KEYSTORE_BASE64 +
# ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD to the
# fork's settings switches every build to that keystore instead.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      desktop_builds:
        description: Also rebuild the Linux and Windows bundles of the current stamp
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The decision is a job of its own so that every platform asks the question
  # once. Re-deriving it per job would race: this fork's Android job is what
  # opens the release, so a desktop job deciding afterwards would find the
  # stamp already released and read a new release as a rebuild.
  decide:
    name: Decide what this push publishes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      tag: ${{ steps.decide.outputs.tag }}
      version_code: ${{ steps.decide.outputs.version_code }}
      added_lines: ${{ steps.decide.outputs.added_lines }}
      desktop: ${{ steps.decide.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to do
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          # `inputs.*` is empty on a push, which is not "true".
          DESKTOP_REQUESTED: ${{ inputs.desktop_builds }}
        run: |
          set -euo pipefail

          declared="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          if [[ ! "$declared" =~ ^([0-9]{2})\.([12])\.([0-9]{6})\+([0-9]+)$ ]]; then
            echo "::error::Expected a stamp version such as 26.2.102620+26102620, got $declared"
            exit 1
          fi
          stamp="${BASH_REMATCH[1]}h${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
          version_code="${BASH_REMATCH[4]}"
          expected_code="${BASH_REMATCH[1]}${BASH_REMATCH[3]}"
          if [[ "$version_code" != "$expected_code" ]]; then
            echo "::error::versionCode must be $expected_code for $stamp"
            exit 1
          fi
          tag="$stamp"

          # -1 means "rebuild": it is the default until a measured line count
          # says otherwise, and it covers every path that never measures —
          # force-pushes, first runs, and new releases alike.
          added=-1

          # A new release is opened when this exact stamp has no release yet.
          if gh release view "$tag" >/dev/null 2>&1; then
            mode=replace
            # Count the lines added since the push's base commit. After a
            # force-push that SHA is unreachable, in which case there is no
            # baseline to compare against — rebuild rather than guess.
            if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              added="$(git diff --numstat "$BEFORE"..HEAD | awk '{added+=$1} END {print added+0}')"
            fi
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$added" -ge 0 && "$added" -le 100 ]]; then
              mode=skip
            fi
          else
            mode=new-release
          fi

          desktop=false
          if [[ "$mode" == "new-release" || "$DESKTOP_REQUESTED" == "true" ]]; then
            desktop=true
          fi

          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "version_code=$version_code"
            echo "added_lines=$added"
            echo "desktop=$desktop"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode tag=$tag version_code=$version_code added_lines=${added:-n/a} desktop=$desktop"

  build-and-publish:
    name: Build APK and publish to the version's release
    needs: decide
    if: needs.decide.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      # The committed lock resolves through the China mirror (see .envrc).
      - name: Resolve locked dependencies
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get --enforce-lockfile

      # Release signing. Gradle hard-fails a release build unless all four
      # ANDROID_* values are present, so every run signs with either the fork's
      # production keystore (when its secrets are set) or the committed test
      # key at ci/techpie-test-keystore.p12 — a fixed key, so rebuilt APKs
      # always update over each other. The secrets context cannot appear in
      # step `if:` expressions, so the absence check happens inside.
      - name: Restore release keystore (optional)
        id: release-key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; signing with the committed test key."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/techpie-release.p12"
          test -s "$RUNNER_TEMP/techpie-release.p12"
          echo "path=$RUNNER_TEMP/techpie-release.p12" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          # Each value prefers the production secret and falls back to the
          # committed test key. PKCS12 keys use the store password for the key
          # entry too, so both passwords are the same.
          ANDROID_KEYSTORE_PATH: ${{ steps.release-key.outputs.path || format('{0}/ci/techpie-test-keystore.p12', github.workspace) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'techpie-ci-store' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'techpie-test' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'techpie-ci-store' }}
          # The APK's versionName is the build stamp (`26h2-102610`) and its
          # versionCode is the same clock as yyMMDDHH, so the About tile shows
          # the stamp and installs order by build time.
          VERSION_NAME: ${{ needs.decide.outputs.tag }}
          VERSION_CODE: ${{ needs.decide.outputs.version_code }}
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --build-name "$VERSION_NAME" \
            --build-number "$VERSION_CODE"

      - name: Publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.decide.outputs.mode }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail

          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          # One fixed asset name per stamp, so a rebuild overwrites the same
          # file instead of stacking dated copies on the release page.
          asset="TechPie-$TAG-android.apk"
          cp "$apk" "$asset"

          # The checksum is what separates a mangled download from a good one:
          # a corrupt transfer keeps the right byte count, and the installer's
          # "packageInfo is NULL" then blames the wrong thing. The block sits
          # under a heading the in-app dialog already strips from the changelog.
          sha="$(sha256sum "$asset" | cut -d' ' -f1)"
          # The markdown fence below is literal text, not an unexpanded
          # expression shellcheck can see through; the directive says so.
          # shellcheck disable=SC2016
          notes="$(printf 'Auto-built APK from %s (%s).\n\nSigned with the development key of this fork (or its production keystore once configured); uninstall any store-signed install first.\n\n## SHA-256\n\n```text\n%s  %s\n```' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$sha" "$asset")"

          if [[ "$MODE" == "new-release" ]]; then
            gh release create "$TAG" "$asset" \
              --target "$GITHUB_SHA" \
              --title "TechPie $TAG" \
              --notes "$notes" \
              --latest
            echo "Opened release $TAG with the APK."
          else
            gh release upload "$TAG" "$asset" --clobber
            # The overwrite changed the bytes; the notes must change with them.
            gh release edit "$TAG" --notes "$notes"
            echo "Replaced the APK on release $TAG."
          fi

  # Both desktop jobs wait on the APK because it is what opens the release:
  # `gh release upload` refuses a tag with no release behind it, and nothing
  # here creates one. They then run side by side, which is exactly what
  # scripts/attach-release-asset.sh retries for — GitHub's upload service
  # answers HTTP 500 when two jobs attach to one release at the same time.
  linux:
    name: Build and publish the Linux bundle
    needs: [decide, build-and-publish]
    if: needs.decide.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    # Measured on the first run: `flutter build linux` took 41 s and the
    # packaging seconds, while the apt install below took 36 minutes — the Qt 6
    # and WebKitGTK dependency sets are the long pole, not the compile. The
    # ceiling belongs to that install, and 60 minutes gave it no room.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop build dependencies
        # What `flutter doctor` asks for on a Linux desktop target — a C++ and
        # CMake toolchain plus GTK 3 headers — and then what this app's plugins
        # ask for on top, which is what a release build died on before the list
        # grew:
        #
        #   libwebkit2gtk-4.1-dev  the desktop WebView fork's WebKitGTK backend
        #                          (CMake: "The following required packages were
        #                          not found: webkit2gtk-4.1")
        #   libsecret-1-dev        flutter_secure_storage_linux
        #   libjsoncpp-dev         and its jsoncpp dependency
        #
        # liblzma-dev is there for the bundled engine's dependency on it.
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libjson-glib-dev \
            qt6-base-dev \
            qt6-declarative-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Enable the Linux desktop target
        # Harmless when the target is already enabled, and it makes a fresh
        # runner behave like the machine the build was developed on.
        run: flutter config --enable-linux-desktop

      - name: Resolve locked dependencies
        # The committed lock resolves through the China mirror (see .envrc).
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get --enforce-lockfile

      - name: Build the Linux release
        # `--no-pub` because the lock was resolved above: the build must not
        # resolve anything of its own. No `--build-name`: a desktop bundle's
        # version comes from pubspec, and `BuildStamp` renders that same stamp
        # on the About tile — no override to keep in step.
        run: flutter build linux --release --no-pub

      - name: Package the Linux bundle
        shell: bash
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail

          # TechPie-<stamp>-linux-x86-64.tar.gz: the APK's grammar, with the
          # file left in whatever shape the build produced. The archive holds
          # `bundle/` itself, so it extracts to one directory — the runner, its
          # libraries and data/ next to each other.
          cmake -S linux/widgets -B build/linux-widgets -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux-widgets --parallel 2
          mkdir -p build/linux/x64/release/bundle/widgets
          cp assets/icon/icon.png build/linux/x64/release/bundle/techpie.png
          cp -R build/linux-widgets/kde linux/widgets/gnome linux/widgets/common \
            build/linux/x64/release/bundle/widgets/
          cp linux/widgets/install.py \
            build/linux/x64/release/bundle/widgets/
          mkdir -p dist
          tar -czf "dist/TechPie-${TAG}-linux-x86-64.tar.gz" \
            -C build/linux/x64/release bundle

          ls -l dist
          sha256sum dist/*.tar.gz

      - name: Attach the Linux bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/attach-release-asset.sh "$TAG" dist/*.tar.gz
          echo "Attached the Linux bundle to release $TAG."

  windows:
    name: Build and publish the Windows bundle
    needs: [decide, build-and-publish]
    if: needs.decide.outputs.desktop == 'true'
    runs-on: windows-2022
    # Pinned, not `windows-latest`: a release should build on an image this
    # pipeline was verified against, not on whatever `latest` becomes next. The
    # pin dates from a real failure: on the `windows-2025-vs2026` image,
    # `flutter_tools/lib/src/windows/visual_studio.dart` mapped an unrecognised
    # Visual Studio major version to the 2019 generator
    #
    #   17 => 'Visual Studio 17 2022',
    #   _  => 'Visual Studio 16 2019',
    #
    # so CMake was asked for a VS 2019 the image does not carry and answered
    # "could not find any instance of Visual Studio" — naming the generator it
    # was given, not the toolchain that is missing. `windows-2022` carries
    # Visual Studio Enterprise 2022 (17.14) with the Desktop C++ workload, which
    # is what Flutter asks for by name.
    timeout-minutes: 60
    # Windows runners run `run:` steps under pwsh by default. Everything below
    # except the packaging step is POSIX shell — including the attach helper,
    # which is a bash file in the repository — so bash is the job default and
    # the one PowerShell step says so for itself.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Enable the Windows desktop target
        # Harmless when the runner image already has it on; the build refuses to
        # start without it.
        run: flutter config --enable-windows-desktop

      - name: Verify the Windows toolchain
        # Prints the Visual Studio flutter_tools found and the components it
        # checks for. Without this, a toolchain mismatch surfaces only as a
        # CMake error naming a VS generator, which does not say what the runner
        # actually has.
        #
        # Not fatal: `flutter doctor` exits non-zero for things this job does
        # not use (an unconfigured Android toolchain), and the log is the point.
        continue-on-error: true
        run: flutter doctor -v

      - name: Allow long checkout paths
        # Windows still refuses a path over 260 characters unless git is told
        # otherwise, and pub checks out one of this app's git dependencies (the
        # webview_flutter fork) into paths that long:
        #
        #   error: cannot stat '.../webview_flutter_android/android/src/main/
        #   java/io/flutter/plugins/webviewflutter/
        #   GeolocationPermissionsCallbackFlutterApiImpl.java': Filename too long
        #
        # That is pub's own `git checkout` inside its cache, so the setting has
        # to be in place before `flutter pub get`, and --global is enough: the
        # runner user owns it, and pub's git inherits it.
        run: git config --global core.longpaths true

      - name: Resolve locked dependencies
        # The committed lock resolves through the China mirror (see .envrc).
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get --enforce-lockfile

      - name: Build the Windows release
        run: flutter build windows --release --no-pub

      - name: Package the Windows bundle
        shell: pwsh
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $bundle)) {
            throw "Flutter produced no Windows bundle at $bundle"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Braced so the variable name cannot run into the literal that follows.
          $archive = "dist/TechPie-${env:TAG}-windows-x86-64.zip"
          # The archive holds the bundle's contents, so it extracts to the same
          # layout as Release/: the executable next to its DLLs and its data
          # directory.
          Compress-Archive -Path "$bundle/*" -DestinationPath $archive -Force
          # The digest is printed for the log only: the release page gets its
          # checksums from the `checksums` job, which reads them back from
          # whatever GitHub actually stored.
          Get-Item $archive | Format-List Name, Length
          Get-FileHash $archive -Algorithm SHA256 | Format-List

      - name: Attach the Windows bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail

          # Git for Windows sets `core.autocrlf=true` in the system config and
          # neither this image nor actions/checkout overrides it, so the
          # checkout carries CRLF and bash would fail on every line of the
          # helper. Normalise the one file this job runs as a shell script; the
          # workspace is throwaway and nothing here commits.
          sed -i 's/\r$//' scripts/attach-release-asset.sh
          scripts/attach-release-asset.sh "$TAG" dist/*.zip
          echo "Attached the Windows bundle to release $TAG."

  # One digest per asset the release actually holds, listed from GitHub's copy
  # of the hashes rather than from what any one job built: a desktop build that
  # died leaves no line behind for a file nobody can download, and a job that
  # printed a digest it then failed to upload would leave the page lying.
  checksums:
    name: Write every asset's checksum to the release
    needs: [decide, build-and-publish, linux, windows]
    # Not `success()`: a Windows build that dies must not cost the release the
    # digests of the bundles that did get through.
    if: ${{ !cancelled() && needs.decide.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rewrite the SHA-256 block
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail

          release="repos/$GH_REPO/releases/tags/$TAG"
          body="$(gh api "$release" --jq '.body // ""')"

          # Everything before this pipeline's own heading is the note the
          # release started with; cutting the block off is what stops a re-run
          # from stacking a second one onto the first.
          intro="$(printf '%s\n' "$body" | awk '/^#+ *SHA-256/{exit} {print}')"

          # `digest` is GitHub's own hash of the bytes it stored, so nothing is
          # re-downloaded and an asset whose job printed no digest still counts.
          # The field is prefixed `sha256:`; the block has always looked like
          # `sha256sum` output, so the prefix goes. Sorted by name so a re-run
          # of the same assets rewrites byte-identical notes.
          {
            printf '%s\n\n## SHA-256\n\n```text\n' "${intro%$'\n'}"
            # The fence markers below are literal text, not an unexpanded
            # expression shellcheck can see through; the directive says so.
            # shellcheck disable=SC2016
            gh api "$release" \
              --jq '.assets[] | select(.digest != null)
                    | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
              | sort --key=2
            printf '```\n'
          } > "$RUNNER_TEMP/notes.md"

          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Release $TAG lists one checksum per asset it carries."
